
name: FIR Synthesis and Physical Design

on:
  workflow_dispatch:
    inputs:
      utilization:
        description: "Target floorplan utilization (%)"
        required: true
        default: "40"
      clock_period:
        description: "Clock period (ns)"
        required: true
        default: "10.0"

  push:
    paths:
      - "rtl/**"
      - "tb/**"
      - "scripts/**"
      - "constraints/**"
      - "config/**"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "rtl/**"
      - "tb/**"
      - "scripts/**"
      - "constraints/**"
      - "config/**"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

permissions:
  contents: read

concurrency:
  group: fir-pd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash -el {0}

    env:
      UTIL: ${{ inputs.utilization || '40' }}
      CLK_PERIOD: ${{ inputs.clock_period || '10.0' }}
      PLACE_DENSITY: "0.40"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euo pipefail
          test -f environment.yml
          test -f Makefile
          test -f rtl/fir_filter.v
          test -f scripts/run_fir_flow.sh
          test -f scripts/flow_fir.tcl
          test -f scripts/synth_fir.ys
          test -f config/sky130_example.env

      - name: Set up Python, Yosys, and Icarus Verilog
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: fir-pd-flow
          cache-environment: true
          init-shell: bash
          post-cleanup: none

      - name: Install OpenROAD and system utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            openroad \
            git \
            make \
            curl \
            ca-certificates

      - name: Obtain Sky130A platform files
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts.git \
            "$RUNNER_TEMP/OpenROAD-flow-scripts"

          export PDK_ROOT="$RUNNER_TEMP/OpenROAD-flow-scripts/flow/platforms"
          export SKY130_PLATFORM="$PDK_ROOT/sky130hd"

          test -d "$SKY130_PLATFORM"

          LIBERTY="$(find "$SKY130_PLATFORM" -type f \
            -name 'sky130_fd_sc_hd__tt_025C_5v00.lib' -print -quit)"
          CELL_LEF="$(find "$SKY130_PLATFORM" -type f \
            -name 'sky130_fd_sc_hd.lef' -print -quit)"
          TECH_LEF="$(find "$SKY130_PLATFORM" -type f \
            -name 'sky130_fd_sc_hd.tlef' -print -quit)"

          test -n "$LIBERTY"
          test -n "$CELL_LEF"
          test -n "$TECH_LEF"

          echo "PDK_ROOT=$PDK_ROOT" >> "$GITHUB_ENV"
          echo "LIBERTY=$LIBERTY" >> "$GITHUB_ENV"
          echo "CELL_LEF=$CELL_LEF" >> "$GITHUB_ENV"
          echo "TECH_LEF=$TECH_LEF" >> "$GITHUB_ENV"

          echo "Liberty: $LIBERTY"
          echo "Cell LEF: $CELL_LEF"
          echo "Technology LEF: $TECH_LEF"

      - name: Verify tool installation
        run: |
          set -euo pipefail
          python --version
          yosys -V
          iverilog -V 2>&1 | head -n 2
          openroad -version
          test -f "$LIBERTY"
          test -f "$CELL_LEF"
          test -f "$TECH_LEF"

      - name: Run RTL simulation
        run: make sim

      - name: Run FIR synthesis and physical design
        run: |
          set -euo pipefail

          export RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_PERIOD}"
          export RUN_DIR="fir_project/runs/${RUN_TAG}"

          chmod +x scripts/run_fir_flow.sh
          ./scripts/run_fir_flow.sh

      - name: List generated outputs
        if: always()
        run: |
          echo "===== Project files ====="
          find fir_project -maxdepth 6 -type f -print 2>/dev/null \
            | sort || true

      - name: Upload FIR physical-design artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fir_project/synth/**
            fir_project/runs/**
