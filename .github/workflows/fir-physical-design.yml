name: FIR Synthesis and Physical Design

on:
  push:
    paths:
      - "fir-filter-cross-design/**"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "fir-filter-cross-design/**"
      - ".github/workflows/fir-physical-design.yml"

  workflow_dispatch:

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fir-filter-cross-design

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: fir-filter-cross-design/environment.yml
          environment-name: fir-pd-flow
          cache-environment: true

      - name: Verify installed tools
        shell: bash -el {0}
        run: |
          yosys -V
          openroad -version
          iverilog -V
          python3 --version

      - name: Verify Sky130 PDK files
        shell: bash -el {0}
        run: |
          source config/sky130_example.env

          for file in "$LIBERTY" "$TECH_LEF" "$CELL_LEF"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: PDK file not found: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Run FIR RTL simulation
        shell: bash -el {0}
        run: |
          make sim

      - name: Check FIR RTL with Yosys
        shell: bash -el {0}
        run: |
          yosys -p "
            read_verilog -sv rtl/fir_filter.v
            hierarchy -check -top fir_filter
            proc
            opt
            check
          "

      - name: Run FIR synthesis and physical design
        shell: bash -el {0}
        run: |
          chmod +x scripts/run_fir_flow.sh
          ./scripts/run_fir_flow.sh

      - name: Verify generated outputs
        if: success()
        shell: bash -el {0}
        run: |
          echo "Checking synthesis outputs..."
          test -s fir_project/synth/fir_filter_netlist.v
          test -s fir_project/synth/fir_filter_netlist.json

          echo "Checking physical-design outputs..."
          test -s fir_project/runs/fir_8tap_w8_util40_clk10/final.def
          test -s fir_project/runs/fir_8tap_w8_util40_clk10/final.odb

          echo "Checking feature outputs..."
          test -s fir_project/runs/fir_8tap_w8_util40_clk10/features.csv
          test -s fir_project/runs/fir_8tap_w8_util40_clk10/features.json

          echo "All required outputs are present."

      - name: Upload FIR flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-results
          path: |
            fir-filter-cross-design/fir_project/synth/
            fir-filter-cross-design/fir_project/runs/
          if-no-files-found: warn
          retention-days: 14
