
name: FIR Synthesis and Physical Design

on:
  workflow_dispatch:
    inputs:
      utilization:
        description: "Target floorplan utilization (%)"
        required: true
        default: "40"
      clock_period:
        description: "Clock period (ns)"
        required: true
        default: "10.0"

  push:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

permissions:
  contents: read

concurrency:
  group: fir-pd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fir-filter-cross-design
        shell: bash -el {0}

    env:
      UTIL: ${{ inputs.utilization || '40' }}
      CLK_PERIOD: ${{ inputs.clock_period || '10.0' }}
      PLACE_DENSITY: "0.40"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euo pipefail

          echo "Project directory: $PWD"
          ls -la

          echo "Checking environment.yml in repository root..."
          test -f ../environment.yml
          echo "FOUND: environment.yml"

          files=(
            "Makefile"
            "rtl/fir_filter.v"
            "tb/tb_fir_filter.v"
            "scripts/run_fir_flow.sh"
            "scripts/flow_fir.tcl"
            "scripts/synth_fir.ys"
            "scripts/extract_fir_features.py"
            "constraints/fir_filter.sdc.in"
            "config/sky130_example.env"
          )

          missing=0
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=$((missing + 1))
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: $missing project files are missing."
            exit 1
          fi

          echo "SUCCESS: All required files were found."

      - name: Set up Python, Yosys, and Icarus Verilog
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: fir-pd-flow
          cache-environment: true
          init-shell: bash
          post-cleanup: none

      - name: Diagnose Conda environment
        run: |
          set -euo pipefail

          echo "CONDA_PREFIX=${CONDA_PREFIX:-unset}"
          echo "Python:"
          command -v python
          python --version

          echo "Yosys:"
          command -v yosys
          yosys -V

          echo "Icarus Verilog:"
          command -v iverilog
          iverilog -V 2>&1 | head -n 2

      - name: Verify OpenROAD
        run: |
          set -euo pipefail

          if ! command -v openroad >/dev/null 2>&1; then
            echo "ERROR: OpenROAD is not installed or is not on PATH."
            exit 1
          fi

          openroad -version

      - name: Verify Sky130A PDK configuration
        run: |
          set -euo pipefail

          source config/sky130_example.env

          for file in "$LIBERTY" "$CELL_LEF" "$TECH_LEF"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required PDK file not found: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

          echo "Sky130A PDK files verified."

      - name: Run RTL simulation
        run: make sim

      - name: Run FIR synthesis and physical design
        run: |
          set -euo pipefail

          export RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_PERIOD}"
          export RUN_DIR="fir_project/runs/${RUN_TAG}"

          chmod +x scripts/run_fir_flow.sh
          ./scripts/run_fir_flow.sh

      - name: List generated outputs
        if: always()
        run: |
          echo "===== Generated project outputs ====="
          if [[ -d fir_project ]]; then
            find fir_project -maxdepth 6 -type f -print | sort
          else
            echo "No fir_project directory was generated."
          fi

      - name: Upload FIR physical-design artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fir-filter-cross-design/fir_project/synth/**
            fir-filter-cross-design/fir_project/runs/**
