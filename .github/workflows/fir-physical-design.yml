
name: FIR Synthesis and Physical Design

on:
  workflow_dispatch:
    inputs:
      utilization:
        description: "Target floorplan utilization (%)"
        required: true
        default: "40"
      clock_period:
        description: "Clock period (ns)"
        required: true
        default: "10.0"

  push:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

permissions:
  contents: read

concurrency:
  group: fir-pd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest

    container:
      image: openroad/orfs:latest

    defaults:
      run:
        working-directory: fir-filter-cross-design
        shell: bash -el {0}

    env:
      UTIL: ${{ inputs.utilization || '40' }}
      CLK_PERIOD: ${{ inputs.clock_period || '10.0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euo pipefail

          echo "Project directory: $PWD"
          ls -la

          test -f ../environment.yml || {
            echo "ERROR: environment.yml missing from repository root."
            exit 1
          }

          files=(
            "Makefile"
            "rtl/fir_filter.v"
            "tb/tb_fir_filter.v"
            "scripts/run_fir_flow.sh"
            "scripts/flow_fir.tcl"
            "scripts/synth_fir.ys"
            "scripts/extract_fir_features.py"
            "constraints/fir_filter.sdc.in"
            "config/sky130_example.env"
          )

          missing=0

          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=$((missing + 1))
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: $missing project files are missing."
            exit 1
          fi

          echo "All required project files were found."

      - name: Set up Python, Yosys, and Icarus Verilog
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ github.workspace }}/environment.yml
          environment-name: fir-pd-flow
          cache-environment: true
          init-shell: bash
          post-cleanup: none

      - name: Verify OpenROAD and synthesis tools
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          echo "Python:"
          command -v python
          python --version

          echo "Yosys:"
          command -v yosys
          yosys -V

          echo "Icarus Verilog:"
          command -v iverilog
          iverilog -V > /tmp/iverilog-version.txt 2>&1 || true
          sed -n '1,3p' /tmp/iverilog-version.txt

          echo "OpenROAD:"
          command -v openroad
          openroad -version

          echo "SUCCESS: Required tools are available."

      - name: Configure and verify Sky130HD PDK
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          ORFS_PLATFORM="/OpenROAD-flow-scripts/flow/platforms/sky130hd"

          LIBERTY_PATH="$ORFS_PLATFORM/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
          TECH_LEF_PATH="$ORFS_PLATFORM/lef/sky130_fd_sc_hd.tlef"
          CELL_LEF_PATH="$ORFS_PLATFORM/lef/sky130_fd_sc_hd_merged.lef"

          for file in \
            "$LIBERTY_PATH" \
            "$TECH_LEF_PATH" \
            "$CELL_LEF_PATH"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Expected ORFS Sky130HD file not found: $file"
              echo "Available platform files:"
              find "$ORFS_PLATFORM" -maxdepth 3 -type f \
                \( -name "*.lib" -o -name "*.lef" \) \
                -print 2>/dev/null | sort || true
              exit 1
            fi
            echo "FOUND: $file"
          done

          sed -i -E \
            "s|^export LIBERTY=.*|export LIBERTY=\"$LIBERTY_PATH\"|" \
            config/sky130_example.env

          sed -i -E \
            "s|^export TECH_LEF=.*|export TECH_LEF=\"$TECH_LEF_PATH\"|" \
            config/sky130_example.env

          sed -i -E \
            "s|^export CELL_LEF=.*|export CELL_LEF=\"$CELL_LEF_PATH\"|" \
            config/sky130_example.env

          source config/sky130_example.env

          test -f "$LIBERTY"
          test -f "$TECH_LEF"
          test -f "$CELL_LEF"

          echo "Sky130HD PDK paths configured and verified."

      - name: Run RTL simulation
        run: |
          set -euo pipefail
          make sim

      - name: Run FIR synthesis and physical design
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          # Normalize the clock tag: 10.0 becomes 10.
          CLK_TAG="$(awk -v c="$CLK_PERIOD" 'BEGIN {
            sub(/0+$/, "", c)
            sub(/\.$/, "", c)
            print c
          }')"

          export PLACE_DENSITY="$(awk -v u="$UTIL" \
            'BEGIN { printf "%.2f", u / 100 }')"

          export RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_TAG}"
          export RUN_DIR="fir_project/runs/${RUN_TAG}"

          echo "RUN_TAG=$RUN_TAG"
          echo "RUN_DIR=$RUN_DIR"
          echo "UTIL=$UTIL"
          echo "PLACE_DENSITY=$PLACE_DENSITY"
          echo "CLK_PERIOD=$CLK_PERIOD"

          chmod +x scripts/run_fir_flow.sh
          ./scripts/run_fir_flow.sh

      - name: Populate FIR configuration CSV
        if: always()
        run: |
          set -euo pipefail

          CLK_TAG="$(awk -v c="$CLK_PERIOD" 'BEGIN {
            sub(/0+$/, "", c)
            sub(/\.$/, "", c)
            print c
          }')"

          RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_TAG}"
          RUN_DIR="fir_project/runs/${RUN_TAG}"
          CSV="$RUN_DIR/fir_features.csv"

          if [[ ! -d "$RUN_DIR" ]]; then
            echo "Run directory not found: $RUN_DIR"
            exit 0
          fi

          DENSITY="$(awk -v u="$UTIL" \
            'BEGIN { printf "%.2f", u / 100 }')"

          mkdir -p "$RUN_DIR"

          # Write one header and exactly one configuration row.
          printf '%s\n' \
            '"run_id","taps","data_width","coeff_width","acc_width","utilization","place_density","clk_period_ns","flow_status","last_completed_stage"' \
            > "$CSV"

          STATUS="artifacts_present_unverified"
          STAGE="unknown"

          if [[ -s "$RUN_DIR/final.odb" &&
                -s "$RUN_DIR/final.def" ]]; then
            STATUS="artifacts_present"
          else
            STATUS="incomplete_or_missing_artifacts"
          fi

          printf '"%s",%s,%s,%s,%s,%s,%s,%s,"%s","%s"\n' \
            "$RUN_TAG" \
            8 8 8 24 "$UTIL" "$DENSITY" "$CLK_PERIOD" \
            "$STATUS" "$STAGE" >> "$CSV"

          echo "Configuration CSV created: $CSV"

      - name: Create tabular feature summary
        if: always()
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          set -euo pipefail

          CLK_TAG="$(awk -v c="$CLK_PERIOD" 'BEGIN {
            sub(/0+$/, "", c)
            sub(/\.$/, "", c)
            print c
          }')"

          RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_TAG}"
          RUN_DIR="fir_project/runs/${RUN_TAG}"

          echo "Using run directory: $RUN_DIR"

          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          run_dir = Path(os.environ.get("RUN_DIR", ""))
          # RUN_DIR is constructed in the shell below and passed explicitly.
          run_dir = Path(os.environ["FIR_SUMMARY_RUN_DIR"])
          summary_path = os.environ["SUMMARY_FILE"]

          def markdown_cell(value):
              value = str(value if value is not None else "")
              return (
                  value.replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
              )

          def render_csv(out, title, filename, columns):
              path = run_dir / filename
              out.write(f"## {title}\n\n")

              if not path.is_file():
                  out.write(f"CSV not found: `{filename}`\n\n")
                  return

              with path.open(
                  "r", newline="", encoding="utf-8-sig"
              ) as handle:
                  reader = csv.DictReader(handle)
                  headers = reader.fieldnames or []
                  rows = list(reader)

              if not headers:
                  out.write("**CSV has no header row.**\n\n")
                  return

              if not rows:
                  out.write(
                      "**No data rows found.** The CSV contains a header "
                      "but no records.\n\n"
                  )
                  return

              selected = [name for name in columns if name in headers]

              if not selected:
                  selected = headers

              out.write("| " + " | ".join(selected) + " |\n")
              out.write("| " + " | ".join("---" for _ in selected) + " |\n")

              for row in rows:
                  out.write(
                      "| "
                      + " | ".join(
                          markdown_cell(row.get(name, ""))
                          for name in selected
                      )
                      + " |\n"
                  )

              out.write("\n")

          with open(summary_path, "a", encoding="utf-8") as out:
              out.write("# FIR Physical-Design Results\n\n")
              out.write(f"**Run:** `{run_dir.name}`\n\n")

              render_csv(
                  out,
                  "FIR Configuration",
                  "fir_features.csv",
                  [
                      "run_id",
                      "taps",
                      "data_width",
                      "coeff_width",
                      "acc_width",
                      "utilization",
                      "place_density",
                      "clk_period_ns",
                      "flow_status",
                      "last_completed_stage",
                  ],
              )

              render_csv(
                  out,
                  "Physical-Design Targets",
                  "physical_targets.csv",
                  [
                      "final_def_available",
                      "final_odb_available",
                      "routed_net_count",
                      "route_segment_count",
                      "wirelength_um",
                      "via_count",
                      "final_detailed_route_violations",
                      "effective_place_density",
                      "design_area_um2",
                      "wns_setup_ns",
                      "tns_setup_ns",
                      "wns_hold_ns",
                      "congestion_overflow",
                      "target_measurement_status",
                  ],
              )

              render_csv(
                  out,
                  "Extracted Netlist and Physical Features",
                  "features.csv",
                  [
                      "design_id",
                      "run_id",
                      "cell_count",
                      "sequential_cell_count",
                      "combinational_cell_count",
                      "buffer_inverter_count",
                      "other_cell_count",
                      "unique_cell_type_count",
                      "avg_bit_fanout",
                      "max_bit_fanout",
                      "wirelength_um",
                      "via_count",
                      "wns_setup_ns",
                      "tns_setup_ns",
                      "wns_hold_ns",
                      "congestion_overflow",
                      "design_area_um2",
                      "target_measurement_status",
                  ],
              )

              render_csv(
                  out,
                  "Pre-placement Features",
                  "preplacement_features.csv",
                  [
                      "design_id",
                      "run_id",
                      "cell_count",
                      "sequential_cell_count",
                      "combinational_cell_count",
                      "buffer_inverter_count",
                      "other_cell_count",
                      "unique_cell_type_count",
                      "avg_bit_fanout",
                      "max_bit_fanout",
                      "utilization_constraint_percent",
                      "clock_period_ns",
                      "taps",
                      "data_width",
                      "coeff_width",
                      "acc_width",
                      "place_density",
                  ],
              )
          PY
        env:
          FIR_SUMMARY_RUN_DIR: fir-filter-cross-design/fir_project/runs/${{ format('fir_8tap_w8_util{0}_clk{1}', inputs.utilization || '40', inputs.clock_period || '10') }}

      - name: Display CSV file locations
        if: always()
        run: |
          set -u

          CLK_TAG="$(awk -v c="$CLK_PERIOD" 'BEGIN {
            sub(/0+$/, "", c)
            sub(/\.$/, "", c)
            print c
          }')"

          RUN_DIR="fir_project/runs/fir_8tap_w8_util${UTIL}_clk${CLK_TAG}"

          echo "===== Generated CSV files ====="

          for file in \
            "$RUN_DIR/features.csv" \
            "$RUN_DIR/fir_features.csv" \
            "$RUN_DIR/physical_targets.csv" \
            "$RUN_DIR/preplacement_features.csv"; do

            if [[ -s "$file" ]]; then
              echo "AVAILABLE: $file"
            else
              echo "MISSING OR EMPTY: $file"
            fi
          done

      - name: Inspect timing and routing reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          CLK_TAG="$(awk -v c="$CLK_PERIOD" 'BEGIN {
            sub(/0+$/, "", c)
            sub(/\.$/, "", c)
            print c
          }')"

          RUN_DIR="fir_project/runs/fir_8tap_w8_util${UTIL}_clk${CLK_TAG}"

          if [[ ! -d "$RUN_DIR" ]]; then
            echo "FIR run directory not found: $RUN_DIR"
            exit 0
          fi

          echo "Using: $RUN_DIR"

          for f in \
            timing_setup.rpt \
            timing_hold.rpt \
            wns_setup.rpt \
            tns_setup.rpt \
            wns_hold.rpt \
            timing_setup_global_route.rpt \
            wns_setup_global_route.rpt \
            tns_setup_global_route.rpt \
            flow_diagnostics.log \
            openroad_log.txt
          do
            if [[ -f "$RUN_DIR/$f" ]]; then
              echo ""
              echo "========== $f =========="
              cat "$RUN_DIR/$f"
            fi
          done

          echo ""
          echo "========== Routing/congestion keywords =========="

          grep -Ein \
            'slack|wns|tns|overflow|congestion|wire.?length|total wire|route' \
            "$RUN_DIR/openroad_log.txt" \
            "$RUN_DIR/flow_diagnostics.log" 2>/dev/null || true

      - name: Upload FIR physical-design artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fir-filter-cross-design/fir_project/synth/**
            fir-filter-cross-design/fir_project/runs/**
