name: FIR Synthesis and Physical Design

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose full sweep or single configuration"
        required: true
        type: choice
        options:
          - sweep
          - single
        default: sweep
      taps:
        description: "FIR taps (single mode)"
        required: true
        default: "8"
      data_width:
        description: "Data width (single mode)"
        required: true
        default: "8"
      utilization:
        description: "Target utilization (%) (single mode)"
        required: true
        default: "40"
      clock_period:
        description: "Clock period (ns)"
        required: true
        default: "10.0"

  push:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "fir-filter-cross-design/rtl/**"
      - "fir-filter-cross-design/tb/**"
      - "fir-filter-cross-design/scripts/**"
      - "fir-filter-cross-design/constraints/**"
      - "fir-filter-cross-design/config/**"
      - "fir-filter-cross-design/Makefile"
      - "fir-filter-cross-design/README.md"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

permissions:
  contents: read

concurrency:
  group: fir-pd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: openroad/orfs:latest

    defaults:
      run:
        working-directory: fir-filter-cross-design
        shell: bash -el {0}

    env:
      RUN_MODE: ${{ inputs.run_mode || 'single' }}
      SINGLE_TAPS: ${{ inputs.taps || '8' }}
      SINGLE_DATA_WIDTH: ${{ inputs.data_width || '8' }}
      SINGLE_UTIL: ${{ inputs.utilization || '40' }}
      SINGLE_CLK_PERIOD: ${{ inputs.clock_period || '10.0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euo pipefail

          test -f ../environment.yml

          files=(
            Makefile
            rtl/fir_filter.v
            tb/tb_fir_filter.v
            scripts/run_fir_flow.sh
            scripts/flow_fir.tcl
            scripts/synth_fir.ys
            scripts/extract_fir_features.py
            constraints/fir_filter.sdc.in
            config/sky130_example.env
          )

          for file in "${files[@]}"; do
            test -f "$file" || {
              echo "ERROR: Missing $file"
              exit 1
            }
            echo "FOUND: $file"
          done

      - name: Set up Python and EDA environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ github.workspace }}/environment.yml
          environment-name: fir-pd-flow
          cache-environment: true
          init-shell: bash
          post-cleanup: none

      - name: Verify tools and validate scripts
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          python --version
          yosys -V
          iverilog -V > /tmp/iverilog-version.txt 2>&1 || true
          sed -n '1,3p' /tmp/iverilog-version.txt
          openroad -version

          bash -n scripts/run_fir_flow.sh
          python -m py_compile scripts/extract_fir_features.py

          echo "All tool and syntax checks passed."

      - name: Configure and verify Sky130HD PDK
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          ORFS_PLATFORM="/OpenROAD-flow-scripts/flow/platforms/sky130hd"

          LIBERTY_PATH="$ORFS_PLATFORM/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
          TECH_LEF_PATH="$ORFS_PLATFORM/lef/sky130_fd_sc_hd.tlef"
          CELL_LEF_PATH="$ORFS_PLATFORM/lef/sky130_fd_sc_hd_merged.lef"

          for file in "$LIBERTY_PATH" "$TECH_LEF_PATH" "$CELL_LEF_PATH"; do
            test -f "$file" || {
              echo "ERROR: Missing PDK file: $file"
              exit 1
            }
            echo "FOUND: $file"
          done

          sed -i -E \
            "s|^export LIBERTY=.*|export LIBERTY=\"$LIBERTY_PATH\"|" \
            config/sky130_example.env

          sed -i -E \
            "s|^export TECH_LEF=.*|export TECH_LEF=\"$TECH_LEF_PATH\"|" \
            config/sky130_example.env

          sed -i -E \
            "s|^export CELL_LEF=.*|export CELL_LEF=\"$CELL_LEF_PATH\"|" \
            config/sky130_example.env

          source config/sky130_example.env

          test -f "$LIBERTY"
          test -f "$TECH_LEF"
          test -f "$CELL_LEF"

          echo "Sky130HD configuration verified."

      - name: Run RTL simulation
        run: |
          set -euo pipefail
          make sim

      - name: Run FIR physical-design configurations
        run: |
          set -euo pipefail

          source /OpenROAD-flow-scripts/env.sh

          chmod +x scripts/run_fir_flow.sh

          COEFF_WIDTH=8
          CLK_PERIOD="$SINGLE_CLK_PERIOD"

          run_configuration() {
            local taps="$1"
            local data_width="$2"
            local utilization="$3"
            local clock="$4"

            local acc_width=$((data_width + COEFF_WIDTH + 8))
            local place_density

            place_density="$(awk -v u="$utilization" \
              'BEGIN { printf "%.2f", u / 100 }')"

            echo
            echo "========================================"
            echo "Starting FIR configuration"
            echo "TAPS          : $taps"
            echo "DATA_WIDTH    : $data_width"
            echo "COEFF_WIDTH   : $COEFF_WIDTH"
            echo "ACC_WIDTH     : $acc_width"
            echo "UTILIZATION   : $utilization"
            echo "PLACE_DENSITY : $place_density"
            echo "CLOCK_PERIOD  : $clock"
            echo "========================================"

            export TAPS="$taps"
            export DATA_WIDTH="$data_width"
            export COEFF_WIDTH
            export ACC_WIDTH="$acc_width"
            export UTIL="$utilization"
            export PLACE_DENSITY="$place_density"
            export CLK_PERIOD_NS="$clock"

            ./scripts/run_fir_flow.sh
          }

          if [[ "$RUN_MODE" == "sweep" ]]; then

            echo "Starting the complete 20-configuration FIR sweep."

            for taps in 4 8; do
              for data_width in 8 16; do
                for utilization in 30 40 50 60; do
                  run_configuration \
                    "$taps" "$data_width" "$utilization" "10.0"
                done
              done
            done

            for utilization in 30 40 50 60; do
              run_configuration 12 8 "$utilization" "10.0"
            done

          elif [[ "$RUN_MODE" == "single" ]]; then

            run_configuration \
              "$SINGLE_TAPS" \
              "$SINGLE_DATA_WIDTH" \
              "$SINGLE_UTIL" \
              "$SINGLE_CLK_PERIOD"

          else
            echo "ERROR: Unsupported RUN_MODE: $RUN_MODE"
            exit 1
          fi

          echo "FIR configuration execution completed."

      - name: Diagnose generated runs
        if: always()
        run: |
          set -u

          echo "===== FIR RUN DIRECTORIES ====="

          if [[ ! -d fir_project/runs ]]; then
            echo "No run directory was generated."
            exit 0
          fi

          find fir_project/runs -mindepth 1 -maxdepth 1 \
            -type d -name 'fir_t*' | sort

          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue

            echo
            echo "========================================"
            echo "RUN: $run_dir"
            echo "========================================"

            for file in \
              final.def \
              final.odb \
              congestion.rpt \
              congestion_overflow.rpt \
              openroad_log.txt \
              flow_diagnostics.log \
              fir_features.csv \
              physical_targets.csv \
              preplacement_features.csv \
              extraction_status.json; do

              if [[ -s "$run_dir/$file" ]]; then
                echo "AVAILABLE: $file"
              else
                echo "MISSING OR EMPTY: $file"
              fi
            done

            if [[ -s "$run_dir/openroad_log.txt" ]]; then
              grep -Ein \
                'Complete detail routing|SUCCESS: Detailed routing|Number of violations|Total wire length|Total number of vias|overflow|congestion|slack|wns|tns' \
                "$run_dir/openroad_log.txt" || true
            fi

          done < <(
            find fir_project/runs -mindepth 1 -maxdepth 1 \
              -type d -name 'fir_t*' | sort
          )

      - name: Create consolidated GitHub summary
        if: always()
        run: |
          set -euo pipefail

          export SUMMARY_FILE="${GITHUB_STEP_SUMMARY:?}"

          python -u - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path("fir_project/runs")
          summary = Path(os.environ["SUMMARY_FILE"])

          def clean(value):
              if value is None:
                  return ""
              if isinstance(value, (dict, list)):
                  value = json.dumps(value, sort_keys=True)
              return str(value).replace("|", "\\|").replace("\n", " ")

          def read_csv(path):
              if not path.is_file():
                  return [], []
              try:
                  with path.open(newline="", encoding="utf-8-sig") as f:
                      reader = csv.DictReader(f)
                      return reader.fieldnames or [], list(reader)
              except (OSError, csv.Error, UnicodeError):
                  return [], []

          runs = sorted(
              p for p in root.glob("fir_t*")
              if p.is_dir()
          ) if root.is_dir() else []

          with summary.open("a", encoding="utf-8") as out:
              out.write("# FIR Physical-Design Results\n\n")
              out.write(f"**Run directories found:** {len(runs)}\n\n")

              if not runs:
                  out.write("No FIR run directories were generated.\n")
              
              for run in runs:
                  out.write(f"## {run.name}\n\n")

                  status_path = run / "extraction_status.json"
                  if status_path.is_file():
                      try:
                          status = json.loads(status_path.read_text())
                          out.write("### Extraction status\n\n")
                          out.write("| Check | Value |\n|---|---|\n")
                          for key, value in status.items():
                              out.write(f"| {clean(key)} | {clean(value)} |\n")
                          out.write("\n")
                      except (OSError, json.JSONDecodeError):
                          out.write("Could not parse extraction status.\n\n")

                  for filename, title in [
                      ("fir_features.csv", "Configuration"),
                      ("preplacement_features.csv", "Pre-placement features"),
                      ("physical_targets.csv", "Physical targets"),
                  ]:
                      headers, rows = read_csv(run / filename)
                      out.write(f"### {title}\n\n")

                      if not headers or not rows:
                          out.write(f"File unavailable or empty: `{filename}`\n\n")
                          continue

                      selected = headers
                      out.write("| " + " | ".join(map(clean, selected)) + " |\n")
                      out.write("| " + " | ".join("---" for _ in selected) + " |\n")

                      for row in rows:
                          out.write(
                              "| " + " | ".join(
                                  clean(row.get(k, "")) for k in selected
                              ) + " |\n"
                          )
                      out.write("\n")

          print(f"Summary written: {summary}")
          print(f"Run directories found: {len(runs)}")
          PY

      - name: Display generated files
        if: always()
        run: |
          set -u

          if [[ ! -d fir_project/runs ]]; then
            echo "No FIR run directories found."
            exit 0
          fi

          find fir_project/runs -type f \
            \( -name 'fir_features.csv' \
               -o -name 'fir_features_status.csv' \
               -o -name 'features.csv' \
               -o -name 'physical_targets.csv' \
               -o -name 'preplacement_features.csv' \
               -o -name 'extraction_status.json' \
               -o -name 'run_report.md' \) \
            -print | sort

      - name: Upload FIR physical-design artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fir-filter-cross-design/fir_project/synth/**
            fir-filter-cross-design/fir_project/runs/**
