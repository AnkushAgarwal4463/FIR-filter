
name: FIR Synthesis and Physical Design

on:
  workflow_dispatch:
    inputs:
      utilization:
        description: "Target floorplan utilization (%)"
        required: true
        default: "40"
      clock_period:
        description: "Clock period (ns)"
        required: true
        default: "10.0"

  push:
    paths:
      - "rtl/**"
      - "tb/**"
      - "scripts/**"
      - "constraints/**"
      - "config/**"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

  pull_request:
    paths:
      - "rtl/**"
      - "tb/**"
      - "scripts/**"
      - "constraints/**"
      - "config/**"
      - "environment.yml"
      - ".github/workflows/fir-physical-design.yml"

permissions:
  contents: read

concurrency:
  group: fir-pd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fir-physical-design:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash -el {0}

    env:
      UTIL: ${{ inputs.utilization || '40' }}
      CLK_PERIOD: ${{ inputs.clock_period || '10.0' }}
      PLACE_DENSITY: "0.40"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euo pipefail

          echo "Repository root: $PWD"
          echo "Root directory contents:"
          ls -la

          files=(
            "environment.yml"
            "Makefile"
            "rtl/fir_filter.v"
            "tb/tb_fir_filter.v"
            "scripts/run_fir_flow.sh"
            "scripts/flow_fir.tcl"
            "scripts/synth_fir.ys"
            "scripts/extract_fir_features.py"
            "constraints/fir_filter.sdc.in"
            "config/sky130_example.env"
          )

          missing=0

          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=$((missing + 1))
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: $missing required project files are missing."
            echo "Move the project contents to the repository root."
            exit 1
          fi

      - name: Set up Python, Yosys, and Icarus Verilog
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: fir-pd-flow
          cache-environment: true
          init-shell: bash
          post-cleanup: none

      - name: Verify installed tools
        run: |
          set -euo pipefail

          python --version
          yosys -V
          iverilog -V 2>&1 | head -n 2

          if ! command -v openroad >/dev/null 2>&1; then
            echo "ERROR: OpenROAD is not installed."
            echo "Install it from a verified, compatible source before continuing."
            exit 1
          fi

          openroad -version

      - name: Verify Sky130A PDK configuration
        run: |
          set -euo pipefail

          source config/sky130_example.env

          test -f "$LIBERTY"
          test -f "$CELL_LEF"
          test -f "$TECH_LEF"

          echo "Sky130A Liberty and LEF files verified."

      - name: Run RTL simulation
        run: make sim

      - name: Run FIR synthesis and physical design
        run: |
          set -euo pipefail

          export RUN_TAG="fir_8tap_w8_util${UTIL}_clk${CLK_PERIOD}"
          export RUN_DIR="fir_project/runs/${RUN_TAG}"

          chmod +x scripts/run_fir_flow.sh
          ./scripts/run_fir_flow.sh

      - name: List generated outputs
        if: always()
        run: |
          echo "===== Generated project outputs ====="
          find fir_project -maxdepth 6 -type f -print 2>/dev/null \
            | sort || true

      - name: Upload FIR physical-design artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fir-physical-design-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            fir_project/synth/**
            fir_project/runs/**
